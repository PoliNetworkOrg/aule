<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>PoliNetwork Aule</title>
    <meta
      name="description"
      content="Trova un'aula libera al Politecnico di Milano: cerca per aula, corso o docente e filtra per giorno, orario e dotazioni."
    />

    <!--
      GitHub Pages (this app's host, see public/CNAME) can't set response
      headers, so the CSP ships as a meta tag. script-src/style-src keep
      'unsafe-inline' for the inline bootstrap below. The 3D campus map (MapLibre GL JS, bundled)
      fetches its style, tiles, sprites and glyphs from OpenFreeMap
      (tiles.openfreemap.org in connect-src) and runs its tile workers from
      blob: URLs (worker-src).
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://api.poliaule.com https://api-beta.poliaule.com; connect-src 'self' https://api.poliaule.com https://api-beta.poliaule.com https://tiles.openfreemap.org; worker-src 'self' blob:; base-uri 'self'; object-src 'none'"
    />

    <meta name="theme-color" content="#ffffff" />
    <script>
      // Set the saved theme before CSS and the splash screen are painted.
      const savedTheme = localStorage.getItem("poliAule_theme");
      const theme =
        savedTheme === "light" || savedTheme === "dark"
          ? savedTheme
          : matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark"
            : "light";
      document.documentElement.dataset.theme = theme;
      document.querySelector('meta[name="theme-color"]').content =
        theme === "dark" ? "#131c2e" : "#ffffff";
    </script>

    <link rel="icon" type="image/png" href="/favicons/main/favicon-96x96.png?v=3" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/favicons/main/favicon.svg?v=3" />
    <link rel="shortcut icon" href="/favicons/main/favicon.ico?v=3" />
    <link rel="apple-touch-icon" sizes="180x180" href="/favicons/main/apple-touch-icon.png?v=3" />
    <meta name="apple-mobile-web-app-title" content="Aule" />
    <link rel="manifest" href="/favicons/main/site.webmanifest?v=3" />

    <link
      rel="preload"
      as="image"
      imagesrcset="/brand/logo-40.png 40w, /brand/logo-80.png 80w, /brand/logo-120.png 120w, /brand/logo-160.png 160w, /brand/logo-240.png 240w"
      imagesizes="72px"
      fetchpriority="high"
    />

    <!-- Critical CSS: only what the splash needs. The app stylesheet is loaded
      non-blocking (see vite.config.ts) and reveals the UI once it lands. -->
    <style>
      :root {
        --splash-bg: #f5f7fb;
        --splash-text: #0f172a;
        --splash-muted: #475569;
      }

      :root[data-theme="dark"] {
        --splash-bg: #020617;
        --splash-text: #f1f5f9;
        --splash-muted: #94a3b8;
      }

      /* Until the app stylesheet lands; its base layer takes over from there. */
      :root:not(.css-ready),
      :root:not(.css-ready) body {
        margin: 0;
        background: var(--splash-bg);
      }

      .noscript-overlay,
      .splash-overlay {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        gap: 12px;
        align-items: center;
        justify-content: center;
        padding: 2rem;
        background: var(--splash-bg);
        color: var(--splash-text);
        font-family: "DM Sans", ui-sans-serif, system-ui, sans-serif;
        text-align: center;
      }

      .splash-logo {
        width: 72px;
        height: 72px;
      }

      .splash-name {
        font-size: 17px;
        font-weight: 700;
      }

      .splash-error-title {
        margin: 0;
        font-size: 18px;
        font-weight: 700;
      }

      .splash-error-subtitle {
        margin: 0 0 8px;
        color: var(--splash-muted);
      }

      /* Keep the real UI out of the layout until the app stylesheet has
         loaded, so it never paints unstyled. */
      :root:not(.css-ready) body > *:not(#splash-overlay) {
        display: none;
      }
    </style>

    <noscript>
      <style>
        body > * {
          display: revert !important;
        }
        #splash-overlay {
          display: none !important;
        }
      </style>
    </noscript>

    <script>
      // Called by each deferred app stylesheet on load/error; reveals the UI
      // once none are pending.
      window.__onShellCssLoad = function (link) {
        link.media = "all";
        if (!document.querySelector('link[data-shell-css][media="print"]')) {
          document.documentElement.classList.add("css-ready");
        }
      };
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- The beta build rewrites this to api-beta, matching its default backend. -->
    <link rel="preconnect" href="https://api.poliaule.com" crossorigin />

    <!-- DM Sans, the PoliNetwork web font; non-blocking, the fallback stack covers the gap. -->
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400..700&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media = 'all'"
    />
    <noscript
      ><link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400..700&display=swap"
        rel="stylesheet"
    /></noscript>

    <!-- HugeIcons (stroke-rounded), self-hosted icon font; non-blocking. -->
    <link
      rel="stylesheet"
      href="/fonts/hugeicons/icons.css"
      media="print"
      onload="this.media = 'all'"
    />
    <noscript><link rel="stylesheet" href="/fonts/hugeicons/icons.css" /></noscript>

    <!-- JS -->
    <script type="module" src="/src/main.tsx"></script>
  </head>

  <!-- The home is an app shell: header, search and controls stay put and only
    the results scroll, so the initial screen always fits the viewport. Very
    short viewports (landscape phones) let the page scroll instead. -->
  <body
    class="data-[page=home]:h-dvh data-[page=home]:overflow-hidden max-lg:short:data-[page=home]:h-auto max-lg:short:data-[page=home]:overflow-auto"
  >
    <div
      id="splash-overlay"
      class="splash-overlay transition-opacity duration-250 ease-[ease-out]"
      aria-hidden="true"
    >
      <img
        src="/brand/logo-80.png"
        srcset="
          /brand/logo-40.png   40w,
          /brand/logo-80.png   80w,
          /brand/logo-120.png 120w,
          /brand/logo-160.png 160w,
          /brand/logo-240.png 240w
        "
        sizes="72px"
        class="splash-logo"
        alt=""
        draggable="false"
      />
      <span class="splash-name">PoliNetwork Aule</span>
    </div>
    <noscript>
      <div class="noscript-overlay">
        <p>PoliNetwork Aule richiede JavaScript. / PoliNetwork Aule requires JavaScript.</p>
      </div>
    </noscript>
    <div
      id="root"
      class="in-data-[page=home]:flex in-data-[page=home]:h-dvh in-data-[page=home]:flex-col max-lg:short:in-data-[page=home]:h-auto"
    ></div>
  </body>
</html>
