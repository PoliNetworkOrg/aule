<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>PoliNetwork Aule</title>
    <meta
      name="description"
      content="Trova un'aula libera al Politecnico di Milano: cerca per aula, corso o docente e filtra per giorno, orario e dotazioni."
    />

    <!--
      GitHub Pages (this app's host, see public/CNAME) can't set response
      headers, so the CSP ships as a meta tag. script-src/style-src keep
      'unsafe-inline' for the inline bootstrap below. The Mapbox origins follow
      Mapbox GL JS's documented CSP requirements for the 3D campus map
      (CDN script/style, 'wasm-unsafe-eval' and blob: workers).
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval' https://api.mapbox.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://api.mapbox.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://api.poliaule.com https://api-beta.poliaule.com https://api.mapbox.com https://*.tiles.mapbox.com; connect-src 'self' https://api.poliaule.com https://api-beta.poliaule.com https://api.mapbox.com https://events.mapbox.com https://*.tiles.mapbox.com; worker-src 'self' blob:; base-uri 'self'; object-src 'none'"
    />

    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f172a" media="(prefers-color-scheme: dark)" />

    <link rel="icon" type="image/png" href="/favicons/main/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/favicons/main/favicon.svg" />
    <link rel="shortcut icon" href="/favicons/main/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/favicons/main/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Aule" />
    <link rel="manifest" href="/favicons/main/site.webmanifest" />

    <link rel="preload" as="image" href="/brand/polinetwork.svg" fetchpriority="high" />

    <!-- Critical CSS: only what the splash needs. The app stylesheet is loaded
      non-blocking (see vite.config.ts) and reveals the UI once it lands. -->
    <style>
      :root {
        --splash-bg: #f8fafc;
        --splash-text: #0f172a;
        --splash-muted: #475569;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --splash-bg: #020617;
          --splash-text: #f1f5f9;
          --splash-muted: #94a3b8;
        }
      }

      html,
      body {
        margin: 0;
        background: var(--splash-bg);
      }

      .noscript-overlay,
      .splash-overlay {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        gap: 12px;
        align-items: center;
        justify-content: center;
        padding: 2rem;
        background: var(--splash-bg);
        color: var(--splash-text);
        font-family: "DM Sans", ui-sans-serif, system-ui, sans-serif;
        text-align: center;
      }

      .splash-logo {
        width: 72px;
        height: 72px;
      }

      .splash-name {
        font-size: 17px;
        font-weight: 700;
      }

      .splash-error-title {
        margin: 0;
        font-size: 18px;
        font-weight: 700;
      }

      .splash-error-subtitle {
        margin: 0 0 8px;
        color: var(--splash-muted);
      }

      /* Keep the real UI out of the layout until the app stylesheet has
         loaded, so it never paints unstyled. */
      :root:not(.css-ready) body > *:not(#splash-overlay) {
        display: none;
      }
    </style>

    <noscript>
      <style>
        body > * {
          display: revert !important;
        }
        #splash-overlay {
          display: none !important;
        }
      </style>
    </noscript>

    <script>
      // Called by each deferred app stylesheet on load/error; reveals the UI
      // once none are pending.
      window.__onShellCssLoad = function (link) {
        link.media = "all";
        if (!document.querySelector('link[data-shell-css][media="print"]')) {
          document.documentElement.classList.add("css-ready");
        }
      };
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- The beta build rewrites this to api-beta, matching its default backend. -->
    <link rel="preconnect" href="https://api.poliaule.com" crossorigin />

    <!-- DM Sans, the PoliNetwork web font; non-blocking, the fallback stack covers the gap. -->
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400..700&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media = 'all'"
    />
    <noscript
      ><link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400..700&display=swap"
        rel="stylesheet"
    /></noscript>

    <!-- HugeIcons (stroke-rounded), self-hosted icon font; non-blocking. -->
    <link
      rel="stylesheet"
      href="/fonts/hugeicons/icons.css"
      media="print"
      onload="this.media = 'all'"
    />
    <noscript><link rel="stylesheet" href="/fonts/hugeicons/icons.css" /></noscript>

    <!-- JS -->
    <script type="module" src="/src/main.tsx"></script>
  </head>

  <body>
    <div id="splash-overlay" class="splash-overlay" aria-hidden="true">
      <img src="/brand/polinetwork.svg" class="splash-logo" alt="" draggable="false" />
      <span class="splash-name">PoliNetwork Aule</span>
    </div>
    <noscript>
      <div class="noscript-overlay">
        <p>PoliNetwork Aule richiede JavaScript. / PoliNetwork Aule requires JavaScript.</p>
      </div>
    </noscript>
    <div id="root"></div>
  </body>
</html>
