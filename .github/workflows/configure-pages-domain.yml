name: Configure GitHub Pages domain

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  configure-dns:
    runs-on: ubuntu-latest
    steps:
      - name: Point custom domain to GitHub Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ZONE_ID: 7ba55951cabeecf5f38d0c35762ea451
        run: |
          set -euo pipefail

          api="https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/dns_records"
          auth="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
          record_name="aule.polinetwork.org"
          record_target="polinetworkorg.github.io"

          records=$(curl --fail-with-body --silent --show-error \
            --get "${api}" \
            --header "${auth}" \
            --header "Content-Type: application/json" \
            --data-urlencode "name=${record_name}")
          record_id=$(jq --raw-output '.result[0].id // empty' <<<"${records}")
          payload=$(jq --null-input \
            --arg name "${record_name}" \
            --arg content "${record_target}" \
            '{type: "CNAME", name: $name, content: $content, ttl: 1, proxied: false}')

          if [[ -n "${record_id}" ]]; then
            response=$(curl --fail-with-body --silent --show-error \
              --request PUT "${api}/${record_id}" \
              --header "${auth}" \
              --header "Content-Type: application/json" \
              --data "${payload}")
          else
            response=$(curl --fail-with-body --silent --show-error \
              --request POST "${api}" \
              --header "${auth}" \
              --header "Content-Type: application/json" \
              --data "${payload}")
          fi

          jq --exit-status '.success == true' <<<"${response}" >/dev/null
